name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to the version we develop against locally. Bumping requires
          # verifying that --experimental-strip-types semantics still match.
          node-version: '22.21.1'

      - name: Run test suite
        run: npm test

      - name: Syntax-check runtime files
        # Tests cover the pure-helper files via import. These files are NOT
        # imported by tests (they pull in @earendil-works/pi-* peer deps),
        # so check them directly so the workflow catches obvious breakage.
        run: |
          node --experimental-strip-types --check agent-error.ts
          node --experimental-strip-types --check agent-failure-policy.ts
          node --experimental-strip-types --check compaction-retry.ts
          node --experimental-strip-types --check control-trailer.ts
          node --experimental-strip-types --check interruption.ts
          node --experimental-strip-types --check precompaction.ts
          node --experimental-strip-types --check roster-thinking.ts
          node --experimental-strip-types --check roster-selector.ts
          node --experimental-strip-types --check roster.ts
          node --experimental-strip-types --check runtime-default-deps.ts
          node --experimental-strip-types --check runtime-deps.ts
          node --experimental-strip-types --check scheduler.ts
          node --experimental-strip-types --check transcript-text.ts
          node --experimental-strip-types --check room-runtime.ts
          node --experimental-strip-types --check index.ts
          node --experimental-strip-types --check lib.ts
